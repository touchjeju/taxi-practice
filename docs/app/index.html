              <circle cx="56" cy="92" r="9" fill="#fff"/>

          </div>
        </div>

        <div class="home-tabs">

          <button class="home-tab">운전할 때</button>
          <button class="home-tab">물건보낼 때</button>
          <button class="home-tab">해외결제</button>
        </div>

        <svg class="map__svg" id="svgS2" preserveAspectRatio="xMidYMid slice">
          <g id="s2Pan">
            <g id="s2Static"></g>
            <g id="s2Me"></g>
            <g id="s2Taxis"></g>
          </g>
        </svg>

        <button class="map-back" data-back aria-label="뒤로"><svg class="i24"><use href="#ic-back"/></svg></button>

        <div class="pin" id="pin">
          <div class="pin__bubble">출발</div>
          <div class="pin__flag">
            <svg viewBox="0 0 40 46">
              <rect x="18.4" y="11" width="2.6" height="31" rx="1.3" fill="#1B1B1B"/>
              <rect x="20" y="4" width="16" height="11" rx="1.6" fill="#fff"/>
              <rect x="20" y="4" width="4" height="3.7" fill="#2F6BFF"/><rect x="28" y="4" width="4" height="3.7" fill="#2F6BFF"/>
              <rect x="24" y="7.7" width="4" height="3.7" fill="#2F6BFF"/><rect x="32" y="7.7" width="4" height="3.7" fill="#2F6BFF"/>
              <rect x="20" y="11.4" width="4" height="3.6" fill="#2F6BFF"/><rect x="28" y="11.4" width="4" height="3.6" fill="#2F6BFF"/>
              <rect x="20" y="4" width="16" height="11" rx="1.6" fill="none" stroke="#1B1B1B" stroke-width="1.2"/>
            </svg>
          </div>
          <div class="pin__shadow" id="pinShadow"></div>
        </div>

        <button class="map-pill" id="btnReserve"><svg class="i20"><use href="#ic-cal"/></svg>예약하기<svg class="i14 map-pill__chev"><use href="#ic-chev"/></svg></button>
        <button class="map-locate" id="btnLocate" aria-label="현위치로"><svg class="i26"><use href="#ic-crosshair"/></svg></button>
      </div>

      <div class="sheet">
        <div class="sheet__row" id="rowOrigin">
          <i class="dot dot--origin"></i>
          <span class="sheet__text" id="originText">제주시청</span>
        </div>
        <div class="sheet__line"></div>
        <div class="sheet__row" id="rowDest">
          <i class="dot dot--dest"></i>
          <span class="sheet__text sheet__text--ph">어디로 갈까요?</span>
        </div>
        <div class="chips">
          <button class="chip" data-fav="home"><svg class="i20"><use href="#ic-home"/></svg>집</button>
          <button class="chip" data-fav="work"><svg class="i20"><use href="#ic-office"/></svg>회사</button>
          <button class="chip" data-fav="airport">제주국제공항</button>
        </div>
      </div>
    </section>

    <!-- ═══════════  S3 · 도착지 검색  ═══════════ -->
    <section class="screen screen--search" data-screen="search">
      <div class="srch-head">
        <button class="srch-back" data-back aria-label="뒤로"><svg class="i26"><use href="#ic-back"/></svg></button>
        <div class="srch-origin"><i class="dot dot--origin"></i><span id="srchOrigin">제주시청</span></div>
        <form class="srch-field" id="srchForm" autocomplete="off" action="#">
          <i class="dot dot--dest"></i>
          <input id="srchInput" type="search" inputmode="text" enterkeyhint="search"
                 autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                 placeholder="도착지 검색">
          <button type="button" class="srch-mic" id="srchMic" aria-label="음성 검색"><svg class="i24"><use href="#ic-mic"/></svg></button>
          <button type="button" class="srch-clear" id="srchClear" aria-label="지우기" hidden><svg class="i22"><use href="#ic-xcircle"/></svg></button>
        </form>
        <div class="srch-tools" id="srchTools">
          <button class="srch-tool" data-fav="home"><svg class="i22"><use href="#ic-home"/></svg>집</button>
          <button class="srch-tool" data-fav="work"><svg class="i22"><use href="#ic-office"/></svg>회사</button>
          <span class="srch-tools__sp"></span>
          <button class="srch-tool srch-tool--icon" aria-label="현위치"><svg class="i24"><use href="#ic-crosshair"/></svg></button>
          <span class="srch-tools__div"></span>
          <button class="srch-tool srch-tool--icon" aria-label="지도에서 찾기"><svg class="i24"><use href="#ic-mapfold"/></svg></button>
        </div>
      </div>
      <div class="srch-body" id="srchBody"></div>
    </section>

    <!-- ═══════════  S4 · 경로 + 호출 옵션  ═══════════ -->
    <section class="screen screen--route" data-screen="route">
      <div class="route-map" id="routeMapBox">
        <svg class="map__svg" id="svgS4" preserveAspectRatio="xMidYMid slice"></svg>
        <div class="route-top">
          <button class="route-top__x" data-back aria-label="닫기"><svg class="i24"><use href="#ic-x"/></svg></button>
          <span class="route-top__from" id="routeFrom">제주시청</span>
          <svg class="i16 route-top__chev"><use href="#ic-chev"/></svg>
          <span class="route-top__to" id="routeTo">제주국제공항</span>
        </div>
        <button class="map-pill map-pill--route" id="btnRecommend"><svg class="i22"><use href="#ic-swap"/></svg>추천경로</button>
      </div>

      <div class="sheet sheet--route">
        <div class="grab"></div>
        <div class="seg">
          <button class="seg__btn is-on">모든 호출</button>
          <button class="seg__btn">원하는 시간으로 호출</button>
        </div>
        <div class="route-addr">
          <div class="route-addr__row"><i class="dot dot--origin"></i><span id="routeAddrFrom">제주시청</span></div>
          <div class="route-addr__row"><i class="dot dot--dest"></i><span id="routeAddrTo">제주국제공항</span></div>
        </div>
        <div class="opts" id="opts"></div>
      </div>
      <div class="cta-wrap">
        <button class="cta" id="ctaCall">일반 호출하기</button>
      </div>
    </section>

    <!-- ═══════════  S1 · 광고 팝업  ═══════════ -->
    <div class="ad" id="adPopup" hidden>
      <div class="ad__dim" id="adDim"></div>
      <div class="ad__wrap">
        <div class="ad__card">
          <div class="ad__body">
            <div class="ad__title">제주형<br>스마트폰 활용</div>
            <svg class="ad__book" viewBox="0 0 300 190">
              <g transform="rotate(-7 150 95)">
                <rect x="36" y="34" width="228" height="132" rx="5" fill="#5FBBD0"/>
                <rect x="44" y="28" width="220" height="132" rx="5" fill="#7FD2E4"/>
                <text x="68" y="66" font-size="22" font-weight="800" fill="#fff">제주형</text>
                <text x="68" y="94" font-size="22" font-weight="800" fill="#fff">스마트폰 활용</text>
                <text x="68" y="142" font-size="14" font-weight="700" fill="#fff">-기초편-</text>
                <rect x="176" y="46" width="68" height="102" rx="10" fill="#fff" stroke="#D5EAF0" stroke-width="2"/>
                <rect x="182" y="54" width="56" height="64" rx="5" fill="#DCF1F7"/>
                <circle cx="194" cy="66" r="5" fill="#2FBF4B"/><circle cx="210" cy="66" r="5" fill="#FEE500"/><circle cx="226" cy="66" r="5" fill="#7B8794"/>
                <circle cx="194" cy="82" r="5" fill="#E8402A"/><circle cx="210" cy="82" r="5" fill="#2F6BFF"/><circle cx="226" cy="82" r="5" fill="#38B44A"/>
                <circle cx="150" cy="126" r="16" fill="#CFCFCF"/><ellipse cx="150" cy="113" rx="20" ry="6.5" fill="#C4C4C4"/>
                <path d="M134 160c0-10 7-18 16-18s16 8 16 18z" fill="#CFCFCF"/>
              </g>
            </svg>
            <div class="ad__ad"><b class="ad-badge">AD</b> Touchjeju 광고입니다.</div>
          </div>
          <div class="ad__actions">
            <button class="ad__act" id="adShare">친구에게 공유</button>
            <button class="ad__act" id="adMore">자세히 보기</button>
          </div>
        </div>
        <button class="ad__close" id="adClose" aria-label="광고 닫기"><svg class="i26"><use href="#ic-x"/></svg></button>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
