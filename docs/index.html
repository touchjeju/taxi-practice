<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<title>카카오 T 택시 연습하기 — 터치제주</title>
<style>
/* 시안(image/main.png)에 쓰인 Paperlogy — 기기에 상관없이 같은 글씨가 나오도록 웹폰트로 받아온다 */
@font-face{font-family:Paperlogy;font-weight:400;font-display:swap;
  src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2") format("woff2")}
@font-face{font-family:Paperlogy;font-weight:500;font-display:swap;
  src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2") format("woff2")}
@font-face{font-family:Paperlogy;font-weight:700;font-display:swap;
  src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2") format("woff2")}

/* ==========================================================================
   터치제주 연습하기 페이지 — 메인 메뉴 (image/main.png 그대로)
   글자·버튼 크기는 화면 너비에 맞춰 같은 비율로 커지고 작아진다.
   ========================================================================== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:#fff;color:#1B1F32;
  font-family:Paperlogy,"Malgun Gothic","맑은 고딕",-apple-system,"Apple SD Gothic Neo",
              "Noto Sans KR","Helvetica Neue",Arial,sans-serif;
  letter-spacing:0;-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;
}

.wrap{
  width:min(100vw,460px);
  font-size:calc(min(100vw,460px) * .0463);   /* 430px 화면에서 20px */
  padding:0 2.3em;
  display:flex;flex-direction:column;
}

/* ───────────── 머리말 ───────────── */
.head{display:flex;align-items:flex-start;gap:1em;padding:3.6em 0 0}
.head__txt{flex:1;min-width:0}
.head__sub{margin:0;font-size:.72em;font-weight:500;color:#4A4E57}
.head__title{margin:.34em 0 0;font-size:1.45em;font-weight:700;line-height:1.34;letter-spacing:0}
.head__icon{width:5.55em;height:5.55em;flex:none;margin-top:-.3em}

/* ───────────── 연습 버튼 ───────────── */
.menu{display:flex;flex-direction:column;gap:1.55em;padding:2.1em 0 0}
.btn{
  display:flex;align-items:center;height:5.15em;padding:0 1.15em;
  border:0;border-radius:.9em;text-align:left;text-decoration:none;
  font-size:1.05em;font-weight:700;letter-spacing:0;color:#fff;
  font-family:inherit;cursor:pointer;
  transition:transform .12s ease,filter .12s ease;
}
.btn:active{transform:scale(.985);filter:brightness(.94)}
.btn--call{background:#4D5CAD}
.btn--cancel{background:#3B457C}
.btn--card{background:#282D4B}
.btn--all{background:#F7DA00;color:#282D4B}

/* ───────────── 꼬리말 ───────────── */
.foot{margin:2.4em 0 2.6em;font-size:.72em;line-height:1.6;color:#8B9099;font-weight:500}
.foot a{color:#4D5CAD;text-decoration:none;border-bottom:1px solid #C9CEE8;padding-bottom:1px}

/* ───────────── 안내 말풍선 ───────────── */
.toast{
  position:fixed;left:50%;bottom:8%;transform:translate(-50%,10px);
  max-width:80%;padding:.7em 1em;border-radius:.7em;
  background:rgba(31,33,38,.92);color:#fff;font-size:.78em;line-height:1.45;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
}
.toast.is-on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<main class="wrap">
  <header class="head">
    <div class="head__txt">
      <p class="head__sub">터치제주 연습하기 페이지</p>
      <h1 class="head__title">카카오 T<br>택시 연습하기</h1>
    </div>
    <img class="head__icon" src="img/kakaot.png" alt="카카오 T" width="558" height="558">
  </header>

  <nav class="menu">
    <a class="btn btn--call"   href="app/?flow=call">택시 호출 연습하기</a>
    <a class="btn btn--cancel" href="app/?flow=cancel">택시 취소 연습하기</a>
    <button class="btn btn--card" id="btnCard" type="button">카드 등록 연습하기</button>
    <a class="btn btn--all"    href="app/?flow=all">한번에 연습하기</a>
  </nav>

  <p class="foot">사진을 보며 따라 하는 <a href="guide/">택시 호출 그림 설명서</a>도 있어요.</p>
</main>

<div class="toast" id="toast"></div>

<script>
(function () {
  var toastEl = document.getElementById('toast'), timer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('is-on');
    clearTimeout(timer);
    timer = setTimeout(function () { toastEl.classList.remove('is-on'); }, 2600);
  }
  document.getElementById('btnCard').addEventListener('click', function () {
    toast('카드 등록 연습은 아직 준비 중이에요.');
  });
})();
</script>

</body>
</html>
